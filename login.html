<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Ipon Challenge</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="back-link" href="index.html">← Home</a>
    <div class="brand-badge small">₱</div>
    <h1>Welcome back!</h1>
    <p class="muted">Mag-login para makita ulit ang savings progress mo.</p>

    <form id="loginForm" class="form-stack">
      <label>
        Email
        <input id="email" type="email" placeholder="name@email.com" required />
      </label>

      <label>
        Password
        <input id="password" type="password" placeholder="••••••••" minlength="6" required />
      </label>

      <button class="btn primary full" type="submit">LOGIN</button>
      <p id="message" class="form-message"></p>
    </form>

    <p class="auth-switch">Wala ka pang account? <a href="signup.html">Sign up</a></p>
  </main>

  <script type="module" src="login.js"></script>
</body>
</html>
