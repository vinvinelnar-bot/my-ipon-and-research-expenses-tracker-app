<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | Ipon Challenge</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="back-link" href="index.html">← Home</a>
    <div class="brand-badge small">₱</div>
    <h1>Create account</h1>
    <p class="muted">Simulan ang sarili mong Ipon Challenge.</p>

    <form id="signupForm" class="form-stack">
      <label>
        Pangalan
        <input id="name" type="text" placeholder="Juan Dela Cruz" maxlength="60" required />
      </label>

      <label>
        Email
        <input id="email" type="email" placeholder="name@email.com" required />
      </label>

      <label>
        Password
        <input id="password" type="password" placeholder="At least 6 characters" minlength="6" required />
      </label>

      <button class="btn primary full" type="submit">CREATE ACCOUNT</button>
      <p id="message" class="form-message"></p>
    </form>

    <p class="auth-switch">May account ka na? <a href="login.html">Login</a></p>
  </main>

  <script type="module" src="signup.js"></script>
</body>
</html>
